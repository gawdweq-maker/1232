<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Display</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="sign-stage" aria-label="Rendered sign">
      <div class="sign-plate">
        <div class="sign-surface">
          <div class="sign-content">
            <div id="signText" class="sign-text" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </section>

    <aside id="debugPanel" class="debug-panel" aria-label="Debug panel">
      <div class="debug-card">
        <div class="debug-header">
          <div>
            <p class="debug-kicker">Debug</p>
            <h1 class="debug-title">sign/index.html</h1>
          </div>
          <span id="statusBadge" class="status-badge">booting</span>
        </div>

        <dl class="debug-stats">
          <div class="stat-row">
            <dt>Mode</dt>
            <dd id="modeValue">standalone</dd>
          </div>
          <div class="stat-row">
            <dt>Chars</dt>
            <dd id="charCount">0</dd>
          </div>
          <div class="stat-row">
            <dt>Lines</dt>
            <dd id="lineCount">0</dd>
          </div>
          <div class="stat-row">
            <dt>Ready</dt>
            <dd id="readyState">pending</dd>
          </div>
        </dl>

        <label class="debug-label" for="debugInput">Manual text</label>
        <textarea
          id="debugInput"
          class="debug-input"
          rows="8"
          placeholder="Type sign text here. New lines are preserved."
        ></textarea>

        <div class="debug-actions">
          <button id="applyButton" class="debug-button debug-button--primary" type="button">Apply</button>
          <button id="clearButton" class="debug-button" type="button">Clear</button>
        </div>

        <div class="preset-group">
          <button class="preset-button" type="button" data-preset="WELCOME TO\nTHE TEST SIGN">Short preset</button>
          <button class="preset-button" type="button" data-preset="Server event result:\nThe item was signed and published successfully.">Event preset</button>
          <button class="preset-button" type="button" data-preset="Dlinnaya stroka dlya proverki avtomaticheskogo perenosa, masshtabirovaniya i bezopasnogo otobrazheniya teksta bez HTML-tegov <b>inline</b>.">Long preset</button>
        </div>

        <label class="debug-label" for="lastText">Last payload</label>
        <pre id="lastText" class="last-text"></pre>
      </div>
    </aside>
  </main>

  <script src="./script.js"></script>
</body>
</html>
